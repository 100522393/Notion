<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs</title>
    <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        font-family: Consolas, Monaco, monospace;
    }

    body {
        box-sizing: border-box;
        padding: 24px;
    }

    .logs-shell {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background: #141414;
        border-radius: 22px;
        overflow: hidden;
        position: relative;

        /* 🔥 borde neon */
        border: 1px solid #1f1f1f;
        box-shadow:
            0 0 0 1px #1f1f1f,
            0 0 20px rgba(0, 200, 255, 0.08),
            0 0 60px rgba(0, 200, 255, 0.04),
            inset 0 0 25px rgba(255, 255, 255, 0.02);
    }

    /* glow superior tipo pantalla */
    .logs-shell::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: linear-gradient(
            to bottom,
            rgba(0, 200, 255, 0.08),
            rgba(0, 200, 255, 0.02),
            transparent
        );
        pointer-events: none;
    }

    #log {
        margin: 0;
        padding: 22px 24px;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
        line-height: 1.45;

        /* 🔥 texto con glow suave */
        color: #d4d4d4;
        text-shadow: 0 0 2px rgba(255,255,255,0.15);

        background: transparent;
    }

    /* 🔥 scrollbar neon */
    #log::-webkit-scrollbar {
        width: 10px;
    }

    #log::-webkit-scrollbar-track {
        background: #0a0a0a;
    }

    #log::-webkit-scrollbar-thumb {
        background: #1f3f4a;
        border-radius: 999px;
        box-shadow: 0 0 10px rgba(0, 200, 255, 0.4);
    }

    #log::-webkit-scrollbar-thumb:hover {
        background: #2f6f7f;
    }

    /* 🔥 colores con glow */

    .ansi-red {
        color: #ff5f5f;
        text-shadow: 0 0 6px rgba(255, 80, 80, 0.6);
    }

    .ansi-green {
        color: #23d18b;
        text-shadow: 0 0 6px rgba(35, 209, 139, 0.5);
    }

    .ansi-yellow {
        color: #f5f543;
        text-shadow: 0 0 6px rgba(255, 255, 80, 0.5);
    }

    .ansi-blue {
        color: #3b8eea;
        text-shadow: 0 0 6px rgba(59, 142, 234, 0.5);
    }

    .ansi-cyan {
        color: #29b8db;
        text-shadow: 0 0 6px rgba(41, 184, 219, 0.5);
    }

    .ansi-magenta {
        color: #d670d6;
        text-shadow: 0 0 6px rgba(214, 112, 214, 0.5);
    }
    </style>
</head>
<body>
    <div class="logs-shell">
        <pre id="log">Cargando logs...</pre>
    </div>

    <script>
        let lastText = "";

        function escapeHtml(text) {
            return text
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }

        function ansiCodeToStyle(code, state) {
            code = Number(code);

            if (code === 0) {
                state.color = null;
                state.background = null;
                state.bold = false;
                return;
            }

            if (code === 1) {
                state.bold = true;
                return;
            }

            if (code === 22) {
                state.bold = false;
                return;
            }

            const fg = {
                30: "#000000",
                31: "#cd3131",
                32: "#0dbc79",
                33: "#e5e510",
                34: "#2472c8",
                35: "#bc3fbc",
                36: "#11a8cd",
                37: "#e5e5e5",
                90: "#666666",
                91: "#f14c4c",
                92: "#23d18b",
                93: "#f5f543",
                94: "#3b8eea",
                95: "#d670d6",
                96: "#29b8db",
                97: "#ffffff"
            };

            const bg = {
                40: "#000000",
                41: "#cd3131",
                42: "#0dbc79",
                43: "#e5e510",
                44: "#2472c8",
                45: "#bc3fbc",
                46: "#11a8cd",
                47: "#e5e5e5",
                100: "#666666",
                101: "#f14c4c",
                102: "#23d18b",
                103: "#f5f543",
                104: "#3b8eea",
                105: "#d670d6",
                106: "#29b8db",
                107: "#ffffff"
            };

            if (code === 39) {
                state.color = null;
                return;
            }

            if (code === 49) {
                state.background = null;
                return;
            }

            if (fg[code]) {
                state.color = fg[code];
                return;
            }

            if (bg[code]) {
                state.background = bg[code];
            }
        }

        function buildStyle(state) {
            let style = "";

            if (state.color) {
                style += "color:" + state.color + ";";
            }

            if (state.background) {
                style += "background-color:" + state.background + ";";
            }

            if (state.bold) {
                style += "font-weight:bold;";
            }

            return style;
        }

        function ansiToHtml(text) {
            // elimina otros caracteres de control raros pero conserva saltos
            text = text.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001A\u001C-\u001F\u007F]/g, "");

            const regex = /\x1b\[([0-9;]*)m/g;
            let result = "";
            let lastIndex = 0;
            let currentOpen = false;

            const state = {
                color: null,
                background: null,
                bold: false
            };

            let match;
            while ((match = regex.exec(text)) !== null) {
                const chunk = text.slice(lastIndex, match.index);
                if (chunk) {
                    result += escapeHtml(chunk);
                }

                if (currentOpen) {
                    result += "</span>";
                    currentOpen = false;
                }

                const codes = match[1] ? match[1].split(";") : ["0"];
                for (const code of codes) {
                    ansiCodeToStyle(code === "" ? "0" : code, state);
                }

                const style = buildStyle(state);
                if (style) {
                    result += '<span style="' + style + '">';
                    currentOpen = true;
                }

                lastIndex = regex.lastIndex;
            }

            const tail = text.slice(lastIndex);
            if (tail) {
                result += escapeHtml(tail);
            }

            if (currentOpen) {
                result += "</span>";
            }

            return result;
        }

        async function refreshLogs() {
            const box = document.getElementById("log");

            try {
                const res = await fetch("/logs/content", { cache: "no-store" });
                const text = await res.text();

                if (text !== lastText) {
                    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;

                    box.innerHTML = ansiToHtml(text);
                    lastText = text;

                    if (atBottom) {
                        box.scrollTop = box.scrollHeight;
                    }
                }
            } catch (e) {
                box.textContent = "Error cargando logs";
            }
        }

        refreshLogs();
        setInterval(refreshLogs, 1000);
    </script>
</body>
</html>
